<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rodrigo Medeiros — Hero</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Crimson+Text:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f4efe7;
      --text: #2f2a28;
      --muted: #7d7269;
      --accent: #982838;
      --gold: #c79641;
      --gold-soft: rgba(199, 150, 65, 0.24);
      --line-soft: rgba(199, 150, 65, 0.16);
      --card-radius: 12px;
      --container: 1150px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Crimson Text";
    }

    img {
      display: block;
      max-width: 100%;
    }

    .hero {
      position: relative;
      min-height: 100vh;
      overflow: hidden;
      background: var(--bg);
    }

    .container {
      position: relative;
      z-index: 2;
      width: min(calc(100% - 48px), var(--container));
      margin: 0 auto;
    }

    .topbar {
      padding: 22px 0 8px;
    }

    .brand {
      font-family: "Crimson Text", serif;
      font-size: 1.25rem;
      letter-spacing: 0.08em;
      font-weight: 700;
    }

    .hero__content {
      display: grid;
      grid-template-columns: 1.08fr 0.92fr;
      align-items: center;
      gap: 56px;
      min-height: calc(100vh - 74px);
      padding: 18px 0 44px;
    }

    .hero__text {
      max-width: 620px;
    }

    .hero__line {
      display: inline-block;
      width: 52px;
      height: 2px;
      background: var(--gold);
      margin-bottom: 34px;
    }

    h1 {
      margin: 0;
      font-family: "Crimson Text", serif;
      font-size: clamp(2.2rem, 5vw, 3.8rem);
      line-height: 1.05;
      font-weight: 500;
      letter-spacing: -0.02em;
      max-width: 900px;
      text-wrap: balance;
    }

    .highlight {
      color: var(--accent);
    }

    .hero__text p {
      margin: 34px 0 30px;
      max-width: 34rem;
      color: var(--muted);
      font-family: "Crimson Text", serif;
      font-size: 1.05rem;
      line-height: 1.7;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 42px;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 36px;
      padding: 0 14px;
      border: 1px solid var(--gold);
      border-radius: 999px;
      color: var(--gold);
      font-size: 0.92rem;
      background: rgba(255, 255, 255, 0.18);
    }

    .hero__actions {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 0 28px;
      border-radius: 999px;
      text-decoration: none;
      font-weight: 500;
      font-size: 1rem;
      transition: transform 180ms ease, box-shadow 180ms ease, background-color 180ms ease;
    }

    .btn:hover {
      transform: translateY(-1px);
    }

    .btn--primary {
      background: var(--accent);
      color: #fff;
      box-shadow: 0 14px 24px rgba(152, 40, 56, 0.16);
    }

    .btn--secondary {
      color: var(--text);
      border: 1px solid var(--gold);
      background: transparent;
    }

    .hero__visual {
      display: flex;
      justify-content: center;
    }

    @keyframes loadPortrait {
      0% {
        opacity: 0;
        transform: translateY(40px);
      }

      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .portrait-frame {
      position: relative;
      width: min(100%, 450px);
      animation: loadPortrait 1.2s cubic-bezier(0.2, 0.8, 0.2, 1);
      transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .portrait-frame:hover {
      transform: translateY(-8px);
    }

    .portrait {
      width: 100%;
      aspect-ratio: 450 / 560;
      object-fit: cover;
      border-radius: var(--card-radius);
      box-shadow: 0 24px 54px rgba(19, 30, 55, 0.08);
      transition: box-shadow 0.4s ease, filter 0.4s ease;
    }

    .portrait-frame:hover .portrait {
      box-shadow: 0 32px 64px rgba(19, 30, 55, 0.16);
      filter: contrast(1.05) brightness(1.02);
    }

    .corner {
      position: absolute;
      width: 66px;
      height: 66px;
      pointer-events: none;
    }

    .corner::before,
    .corner::after {
      content: "";
      position: absolute;
      background: var(--gold);
    }

    .corner--tl {
      top: -12px;
      left: -60px;
    }

    .corner--tl::before {
      top: 0;
      left: 0;
      width: 66px;
      height: 2px;
    }

    .corner--tl::after {
      top: 0;
      left: 0;
      width: 2px;
      height: 66px;
    }

    .corner--br {
      right: -58px;
      bottom: -12px;
    }

    .corner--br::before {
      right: 0;
      bottom: 0;
      width: 66px;
      height: 2px;
    }

    .corner--br::after {
      right: 0;
      bottom: 0;
      width: 2px;
      height: 66px;
    }

    .diamond {
      position: absolute;
      top: -26px;
      right: -14px;
      width: 18px;
      height: 18px;
      background: #d8b06a;
      transform: rotate(45deg);
      border-radius: 2px;
    }

    .hero__bg {
      position: absolute;
      opacity: 0.34;
      pointer-events: none;
    }

    .hero__bg svg {
      width: 100%;
      height: 100%;
    }

    .hero__bg--left {
      left: -110px;
      bottom: -84px;
      width: 340px;
      height: 340px;
      opacity: 0.26;
    }

    .hero__bg--right {
      top: -34px;
      right: -24px;
      width: 360px;
      height: 360px;
      opacity: 0.22;
    }

    .compass-circle,
    .compass-star {
      stroke: var(--line-soft);
      fill: none;
    }

    .compass-circle {
      stroke-width: 1;
    }

    .compass-circle--outer {
      opacity: 0.6;
    }

    .compass-star {
      fill: rgba(233, 222, 205, 0.55);
      stroke: rgba(210, 194, 168, 0.18);
    }

    .reveal {
      opacity: 0;
      transform: translateY(18px);
      transition: opacity 640ms ease, transform 640ms ease;
    }

    .reveal.is-visible {
      opacity: 1;
      transform: translateY(0);
    }

    @media (max-width: 980px) {
      .hero__content {
        grid-template-columns: 1fr;
        gap: 34px;
        padding-top: 26px;
      }

      .hero__text {
        max-width: 100%;
      }

      h1 {
        max-width: 100%;
      }

      .hero__visual {
        order: -1;
        justify-content: flex-start;
      }

      .portrait-frame {
        width: min(100%, 420px);
      }

      .corner--tl {
        left: -18px;
      }

      .corner--br {
        right: -18px;
      }
    }

    @media (max-width: 640px) {
      .container {
        width: min(calc(100% - 32px), var(--container));
      }

      .topbar {
        padding-top: 16px;
      }

      .brand {
        font-size: 1rem;
      }

      .hero {
        min-height: auto;
      }

      .hero__content {
        gap: 24px;
        min-height: auto;
        padding-bottom: 40px;
      }

      h1 {
        font-size: clamp(2.4rem, 8vw, 3.2rem);
        line-height: 1.1;
      }

      .hero__text p {
        margin-top: 20px;
        font-size: 1.1rem;
      }

      .hero__actions {
        flex-direction: column;
        align-items: stretch;
      }

      .btn {
        width: 100%;
      }

      .hero__visual {
        justify-content: center;
        margin-bottom: 16px;
      }

      .portrait-frame {
        width: min(100%, 340px);
      }

      .hero__bg--right {
        width: 220px;
        height: 220px;
      }

      .hero__bg--left {
        width: 250px;
        height: 250px;
        left: -120px;
      }
    }
  </style>
</head>

<body>
  <main class="hero">
    <div class="hero__bg hero__bg--left" aria-hidden="true">
      <svg viewBox="0 0 320 320" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="160" cy="160" r="110" class="compass-circle"></circle>
        <circle cx="160" cy="160" r="160" class="compass-circle compass-circle--outer"></circle>
        <path d="M160 0L180 140L320 160L180 180L160 320L140 180L0 160L140 140L160 0Z" class="compass-star"></path>
      </svg>
    </div>

    <div class="hero__bg hero__bg--right" aria-hidden="true">
      <svg viewBox="0 0 320 320" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M160 0L180 140L320 160L180 180L160 320L140 180L0 160L140 140L160 0Z" class="compass-star"></path>
      </svg>
    </div>

    <div class="container">
      <header class="topbar">
        <div class="brand">RODRIGO MEDEIROS</div>
      </header>

      <section class="hero__content">
        <div class="hero__text">
          <span class="hero__line"></span>

          <h1>
            Design, Dados e <span class="highlight">Inteligência Artificial</span> para transformar complexidade em
            decisão.
          </h1>

          <p>
            Pesquisador, professor e consultor em projetos que conectam
            estratégia, tecnologia e experiência.
          </p>

          <div class="tags" aria-label="Áreas de atuação">
            <span class="tag">Design</span>
            <span class="tag">Dados</span>
            <span class="tag">IA</span>
            <span class="tag">Pesquisa</span>
            <span class="tag">Estratégia</span>
          </div>

          <div class="hero__actions">
            <a href="#" class="btn btn--primary">Conversar sobre um projeto</a>
            <a href="#" class="btn btn--secondary">Ver atuação</a>
          </div>
        </div>

        <div class="hero__visual">
          <div class="portrait-frame">
            <span class="corner corner--tl"></span>
            <span class="corner corner--br"></span>
            <span class="diamond"></span>
            <img src="img.png" alt="Retrato de Rodrigo Medeiros" class="portrait" />
          </div>
        </div>
      </section>
    </div>
  </main>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      document.querySelector(".btn--primary")?.addEventListener("click", (e) => {
        e.preventDefault();
        alert("Vamos conversar sobre seu projeto 🚀");
      });

      document.querySelector(".btn--secondary")?.addEventListener("click", (e) => {
        e.preventDefault();
        const section = document.querySelector("#about");
        section ? section.scrollIntoView({ behavior: "smooth", block: "start" }) : alert("Seção de atuação ainda não disponível.");
      });
    });
  </script>
</body>

</html>
